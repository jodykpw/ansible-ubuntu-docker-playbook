default:
  image: gitlab-registry.domain.com/container/iac-cicd:1.1.1

.ssh_scripts: &ssh_scripts
  # Use to start the SSH agent and set up the necessary environment variables in the current shell session.
  - eval $(ssh-agent -s)
  # Takes the processed private key and pipes it into ssh-add, which adds the key to the SSH agent.
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  # Add the ip address of a remote server to the known_hosts file on the gitlab runner build folder. 
  - ssh-keyscan $REMOTE_IPADDRESS >> ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts
  - pwd
  - ls -la

stages:
  - test
  - deploy

test_ssh_connection:
  stage: test
  script:
    - *ssh_scripts
    - ansible -i hosts.ini all -m ping -vvv
  tags:
    - docker-socket

init-server:
  stage: deploy
  script:
    - *ssh_scripts
    - ansible-playbook init-server.yml -i hosts.ini
  when: manual  
  tags:
    - docker-socket

docker:
  stage: deploy
  script:
    - *ssh_scripts
    - ansible-playbook docker.yml -i hosts.ini
  when: manual  
  tags:
    - docker-socket

rsnapshot:
  stage: deploy
  script:
    - *ssh_scripts
    - ansible-playbook mount.yml -i hosts.ini
    - ansible-playbook rsnapshot.yml -i hosts.ini
  when: manual  
  tags:
    - docker-socket

remote-reboot:
  stage: deploy
  script:
    - *ssh_scripts
    - ansible-playbook remote-reboot.yml -i hosts.ini
  when: manual  
  tags:
    - docker-socket